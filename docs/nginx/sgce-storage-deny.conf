# SGCE 1.0.197 - Bloqueo Nginx/Plesk para rutas privadas
# Pegar dentro del server block o en Directivas adicionales de Nginx de Plesk.

location ^~ /storage/ { deny all; return 403; }
location ^~ /app/ { deny all; return 403; }
location ^~ /src/ { deny all; return 403; }
location ^~ /config/ { deny all; return 403; }
location ^~ /includes/ { deny all; return 403; }
location ^~ /install/ { deny all; return 403; }
location ^~ /modules/ { deny all; return 403; }
location ^~ /repositories/ { deny all; return 403; }
location ^~ /services/ { deny all; return 403; }
location ^~ /views/ { deny all; return 403; }
location ^~ /cron/ { deny all; return 403; }
location ^~ /tools/ { deny all; return 403; }
location ^~ /tests/ { deny all; return 403; }

location ~* \.(sql|log|bak|backup|old|orig|tmp|zip|tar|gz|7z|dm)$ { deny all; return 403; }
